# Pruebas automáticas en cada push y pull request a main (regresión):
#   1. JUnit: las 32 pruebas unitarias y de integración, con el reporte de cobertura de JaCoCo.
#   2. API: levanta la aplicación y ejecuta la colección de Bruno contra ella.
# Los reportes quedan como artefacto en la pestaña Actions.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: JUnit + Bruno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas JUnit y cobertura
        run: chmod +x gradlew && ./gradlew test jacocoTestReport --no-daemon
      - name: Levantar la API (H2 en memoria)
        run: |
          nohup ./gradlew bootRun --no-daemon > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:14080/avistamientos > /dev/null && exit 0; sleep 2; done
          cat api.log; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Colección de Bruno
        working-directory: bruno
        run: |
          # la carpeta de reportes está en .gitignore: Bruno falla si no existe
          mkdir -p reportes
          npx --yes @usebruno/cli@4.3.0 run -r --env local --reporter-junit reportes/bruno.xml --reporter-html reportes/bruno.html
      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
            bruno/reportes
          if-no-files-found: ignore
